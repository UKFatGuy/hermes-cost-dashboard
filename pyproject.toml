[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-cost-dashboard"
version = "0.1.0"
description = "A live cost dashboard for Hermes Agent — track your LLM API spending by profile, model, and time period"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Colin Richardson", email = "buttblight@live.co.uk" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
]

[project.scripts]
hermes-cost-dashboard = "hermes_cost_dashboard.main:run"

[tool.hatch.build.targets.wheel]
packages = ["hermes_cost_dashboard"]
